# Perfect Home Stage — Natalie & the pack harem1

project_name: "Perfect Home"

tagline: "House status, inventory, calendar, and character state for Natalie and Victor"

visibility: 'PRIVATE'

# ADJACENT = side panel (recommended)
# COVER = overlays chat history
# FULLSCREEN = covers almost everything
position: 'ADJACENT'

tags:
  - 'slice-of-life'
  - 'inventory'
  - 'calendar'
  - 'character'
  - 'house'
  - 'bunnygirl'

config_schema:
  type: object
  title: "Display Settings"
  properties:
    theme:
      title: "Theme"
      type: string
      enum: ['dark', 'light']
      default: 'dark'
    showInventory:
      title: "Show Inventory"
      type: boolean
      default: true
    showCalendar:
      title: "Show Calendar"
      type: boolean
      default: true
    showImages:
      title: "Show Image Gallery"
      type: boolean
      default: true

state_schema:
  init:
    type: object
    properties:
      started:
        type: string
  message:
    type: object
    properties:
      inventory:
        type: array
      calendar:
        type: array
      location:
        type: string
      desire:
        type: string
      outfit:
        type: string
      images:
        type: array
  chat:
    type: object
    properties: {}

is_anonymous: false
ratings_disabled: false

github_path: 'https://github.com/boxoflunchandcode/PerfectHomeStagesliceoflife'

extension_id: 'perfecthomestage-0d3ee34c346d'
